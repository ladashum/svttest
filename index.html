const PAIR_CHECKS = [
  [0, 13],
  [4, 56],
  [7, 20],
  [11, 24],
  [6, 32],
  [8, 21],
  [10, 23],
  [5, 18]
];

const answers = new Array(QUESTIONS.length).fill(null);
let idx = 0;

const $ = (id) => document.getElementById(id);

function renderQuestion() {
  const q = QUESTIONS[idx];
  $("progressLabel").textContent = `Вопрос ${idx + 1} из ${QUESTIONS.length}`;
  $("bar").style.width = `${((idx) / QUESTIONS.length) * 100}%`;
  $("qText").textContent = q.t;
  $("prevBtn").disabled = idx === 0;
  $("nextBtn").textContent = idx === QUESTIONS.length - 1 ? "Показать результат" : "Дальше";
  $("nextBtn").disabled = answers[idx] == null;
  const scale = $("scale");
  scale.innerHTML = "";
  LABELS.forEach((lab, i) => {
    const val = i + 1;
    const el = document.createElement("label");
    el.className = "opt" + (answers[idx] === val ? " selected" : "");
    el.innerHTML = `<input type="radio" name="q" value="${val}"><div>${lab}</div>`;
    el.addEventListener("click", () => {
      answers[idx] = val;
      renderQuestion();
    });
    scale.appendChild(el);
  });
}

function traitScores() {
  const acc = {};
  TRAITS.forEach(t => acc[t] = {sum:0, w:0});
  QUESTIONS.forEach((q, i) => {
    if (q.tr === "sd") return;
    const raw = answers[i];
    if (raw == null) return;
    const scored = q.d === 1 ? raw : (6 - raw);
    acc[q.tr].sum += scored;
    acc[q.tr].w += 5;
  });
  const out = {};
  TRAITS.forEach(t => out[t] = acc[t].w ? (acc[t].sum / acc[t].w) * 100 : 50);
  return out;
}

function socialDesirability() {
  let s = 0, n = 0;
  QUESTIONS.forEach((q, i) => {
    if (q.tr !== "sd") return;
    const raw = answers[i];
    const scored = q.d === 1 ? raw : (6 - raw);
    s += scored; n += 5;
  });
  return n ? (s / n) * 100 : 50;
}

function consistency() {
  let diffs = [];
  PAIR_CHECKS.forEach(([a,b]) => {
    if (answers[a] == null || answers[b] == null) return;
    const qa = QUESTIONS[a], qb = QUESTIONS[b];
    const sa = qa.d === 1 ? answers[a] : 6 - answers[a];
    const sb = qb.d === 1 ? answers[b] : 6 - answers[b];
    diffs.push(Math.abs(sa - sb));
  });
  if (!diffs.length) return 100;
  const avg = diffs.reduce((x,y)=>x+y,0) / diffs.length;
  return Math.max(0, Math.round(100 - (avg / 4) * 100));
}

function similarity(user, member) {
  let dist = 0;
  TRAITS.forEach(t => {
    dist += Math.abs(user[t] - member.vec[t]);
  });
  const max = 100 * TRAITS.length;
  return Math.round((1 - dist / max) * 1000) / 10;
}

function traitName(t) {
  return {
    lead: "принятие ответственности за общее",
    nurture: "эмоциональная доступность и игровая близость",
    gentleman: "такт и сохранение лица другого",
    flow: "гибкость при смене условий",
    stage: "полная включённость при внешней оценке",
    quiet: "наблюдательность и потребность в паузе",
    craft: "автономия и порог качества",
    heart: "аффективная проницаемость",
    care: "практическая поддержка",
    philo: "рефлексия собственных рамок",
    verbal: "проговаривание как способ действовать",
    cool: "низкая эмоциональная заразительность",
    drive: "внутренняя планка независимо от статуса"
  }[t];
}

function topTraits(vec, n=4) {
  return Object.entries(vec).sort((a,b)=>b[1]-a[1]).slice(0,n);
}

function explain(user, member) {
  const highsU = topTraits(user, 5).map(x=>x[0]);
  const highsM = topTraits(member.vec, 5).map(x=>x[0]);
  const shared = highsU.filter(t => highsM.includes(t));
  const gaps = TRAITS
    .map(t => ({t, d: Math.abs(user[t]-member.vec[t])}))
    .sort((a,b)=>b.d-a.d)
    .slice(0,2);

  let text = member.whyLead + ". ";
  if (shared.length) {
    text += "Совпадают опорные оси: " + shared.map(traitName).join(", ") + ". ";
  }
  text += "Это не значит, что вы «копия». Портрет мембера собран из публичного поведения: интервью, Going Seventeen, то, как о нём говорят другие участники. ";
  if (gaps[0] && gaps[0].d > 28) {
    text += `Самое заметное расхождение — «${traitName(gaps[0].t)}»: у вас этот контур ${user[gaps[0].t] > member.vec[gaps[0].t] ? "выражен сильнее" : "тише"}, чем в его устойчивом образе.`;
  }
  return text;
}

function renderResult() {
  const user = traitScores();
  const sd = socialDesirability();
  const cons = consistency();
  const ranked = MEMBERS
    .map(m => ({...m, score: similarity(user, m)}))
    .sort((a,b)=>b.score-a.score);
  const top = ranked[0];
  const second = ranked[1];
  const third = ranked[2];

  let flags = [];
  if (sd >= 78) flags.push("Шкала социальной желательности повышена: ответы чуть «слишком правильные». Результат читайте как идеальный автопортрет, не как бытовой.");
  if (cons < 62) flags.push("Согласованность ниже обычной: на перефразах одни и те же качества гуляют. Либо вы в переходном состоянии, либо часть ответов была наугад.");
  if (cons >= 80 && sd < 70) flags.push("Профиль внутренне ровный: перефразы не разъехались, желательность в норме.");

  const bars = ranked.map(m => `
    <div class="mchip">
      <div><strong>${m.name}</strong> · ${m.score}%</div>
      <div class="barline"><div class="barfill" style="width:${m.score}%"></div></div>
    </div>`).join("");

  const userBars = topTraits(user, 13).map(([t,v]) => `
    <div class="mchip">
      <div>${traitName(t)}</div>
      <div class="barline"><div class="barfill" style="width:${v}%"></div></div>
    </div>`).join("");

  $("result").innerHTML = `
    <div class="card result-hero">
      <div class="match-card">
        <div class="kicker">ближайший портрет</div>
        <div style="font-size:14px;opacity:.8;margin-top:8px;">${top.emoji} ${top.kr} · ${top.mbti} · ${top.unit}</div>
        <h2 style="color:#fff;margin:8px 0 4px;">${top.name}</h2>
        <div class="pct">${top.score}%</div>
        <p style="opacity:.9;max-width:60ch;">${top.real}. Совпадение паттерна, не приговор и не фанфик.</p>
      </div>
      <div>
        <h2>Почему именно ${top.name}</h2>
        <div class="why">${explain(user, top)}</div>
        <p>${top.portrait}</p>
      </div>
    </div>
    <div class="card">
      <h2>Ещё два близких контура</h2>
      <p><strong>${second.name}</strong> (${second.score}%) — ${explain(user, second)}</p>
      <p style="margin-top:10px;"><strong>${third.name}</strong> (${third.score}%) — ${explain(user, third)}</p>
    </div>
    <div class="card">
      <h2>Полный рейтинг 13</h2>
      <div class="member-grid">${bars}</div>
    </div>
    <div class="card">
      <h2>Ваш сырой профиль</h2>
      <p class="small muted">Эти шкалы собраны из прямых, перевёрнутых и перефразированных пунктов.</p>
      <div class="member-grid" style="margin-top:12px;">${userBars}</div>
    </div>
    <div class="card">
      <h2>Диагностические пометки</h2>
      <p>Согласованность перефразов: <strong>${cons}%</strong>. Социальная желательность: <strong>${Math.round(sd)}%</strong>.</p>
      ${flags.map(f=>`<p class="why">${f}</p>`).join("")}
      <p class="disclaimer">Это развлекательно-аналитический тест. Он не ставит MBTI, не заменяет психолога и не утверждает, что мемберы «такие навсегда». Портреты — синтез публичных источников 2019–2026: Going Seventeen, интервью, взаимные описания участников, повторяющиеся MBTI. У Jun, Vernon, Dino, Joshua типы в разные годы плавали — в модели использован устойчивый поведенческий кластер, а не одна анкета.</p>
      <div class="row" style="margin-top:16px;">
        <button type="button" onclick="location.reload()">Пройти заново</button>
      </div>
    </div>
  `;
}

$("startBtn").addEventListener("click", () => {
  $("intro").classList.add("hidden");
  $("quiz").classList.remove("hidden");
  renderQuestion();
  window.scrollTo({top:0, behavior:"smooth"});
});

$("prevBtn").addEventListener("click", () => {
  if (idx > 0) { idx--; renderQuestion(); window.scrollTo({top:0,behavior:"smooth"}); }
});

$("nextBtn").addEventListener("click", () => {
  if (answers[idx] == null) return;
  if (idx < QUESTIONS.length - 1) {
    idx++;
    renderQuestion();
    window.scrollTo({top:0,behavior:"smooth"});
  } else {
    $("quiz").classList.add("hidden");
    $("result").classList.remove("hidden");
    renderResult();
    window.scrollTo({top:0,behavior:"smooth"});
  }
});
</script>
