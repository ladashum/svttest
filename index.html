  {t:"Ко мне обращаются за утешением чаще, чем я сам инициирую такие разговоры.",tr:"nurture",d:1},
  {t:"Обо мне чаще говорят «корректный», чем «эффектный».",tr:"gentleman",d:1},
  {t:"Давление через чувство долга («если тебе не всё равно — сделай») вызывает у меня сопротивление.",tr:"flow",d:1},
  {t:"Выполнить работу заметно ниже своего максимума при внешней оценке для меня внутренне недопустимо.",tr:"stage",d:1},
  {t:"После насыщенного социального дня мне нужно время без входящих стимулов.",tr:"quiet",d:1},
  {t:"Предпочту спор из-за стандарта, чем согласие ценой снижения качества.",tr:"craft",d:1},
  {t:"Оценка — похвала или неловкость — может сместить мне фон всего дня.",tr:"heart",d:1},
  {t:"Мне важно быть тем, благодаря кому общая инфраструктура (дом, смена, проект) не разваливается.",tr:"care",d:1},
  {t:"Я сознательно пересматриваю рамки, которые когда-то принял, чтобы соответствовать окружению.",tr:"philo",d:1},
  {t:"Если задевают человека из моего круга, я скорее обозначу позицию вслух, чем сглажу ради тишины.",tr:"verbal",d:1},
  {t:"Моя базовая скорость реакции ниже социально принятой: я не тороплюсь отвечать сразу.",tr:"cool",d:1},
  {t:"Для меня существенно ощущать измеримый прирост относительно собственного вчерашнего уровня.",tr:"drive",d:1},
  {t:"Я беру на себя лишний объём, потому что иначе останется чувство вины.",tr:"lead",d:1},
  {t:"Игровая провокация без злости — привычный для меня способ проверить близость.",tr:"nurture",d:1},
  {t:"В конфликте я скорее снижу температуру, чем стану тем, кто вскрывает противоречие.",tr:"gentleman",d:1},
  {t:"Если мою шутку поняли не все, я редко начинаю подстраивать юмор под большинство.",tr:"flow",d:1},
  {t:"Телесная готовность (повторение, отработка) для меня надёжнее абстрактного плана на неделю.",tr:"stage",d:1},
  {t:"Постоянное требование быть удобным в контакте меня истощает.",tr:"quiet",d:1},
  {t:"В фазе глубокой работы я могу на время выпасть из переписки и бытовых чатов.",tr:"craft",d:1},
  {t:"Чужое неблагополучие отзывается телесно, даже если формально я ни при чём.",tr:"heart",d:1},
  {t:"Приготовить еду, закрыть логистику, взять на себя маршрут — естественный для меня язык поддержки.",tr:"care",d:1},
  {t:"Согласованность с собой для меня важнее, чем роль, в которой меня проще принимать.",tr:"philo",d:1},
  {t:"Разговор для меня инструмент мышления, а не только обмена новостями.",tr:"verbal",d:1},
  {t:"Коллективный подъём настроения сам по себе меня не заражает: нужен собственный интерес.",tr:"cool",d:1},
  {t:"Формальный статус в группе я учитываю, но не делаю его оправданием снижения собственной планки.",tr:"drive",d:1},
  {t:"В отношениях я всегда точно называю свои мотивы и никогда их не смягчаю.",tr:"sd",d:1},
  {t:"Случается представить свой поступок чуть выгоднее, чем он выглядел в момент действия.",tr:"sd",d:-1},
  {t:"Зависть к людям своего круга мне совершенно незнакома.",tr:"sd",d:1},
  {t:"Иногда я удерживаю раздражение дольше, чем готов в этом признаться.",tr:"sd",d:-1},
  {t:"В любом споре я выслушиваю собеседника до конца и не перебиваю.",tr:"sd",d:1},
  {t:"Я умею незаметно сместить ход разговора в удобную мне сторону.",tr:"sd",d:-1},
  {t:"Если общее дело рискует выглядеть несобранным, тревога возникает у меня раньше, чем у большинства.",tr:"lead",d:1},
  {t:"Ожидание постоянной эмоциональной доступности с моей стороны вызывает раздражение.",tr:"nurture",d:-1},
  {t:"Когда вежливость начинает маскировать суть, я допускаю более прямую формулировку.",tr:"gentleman",d:-1},
  {t:"Неожиданное изменение плана скорее повышает у меня напряжение, чем даёт свободу.",tr:"flow",d:-1},
  {t:"Необходимость быть объектом внимательного взгляда других я стараюсь сократить.",tr:"stage",d:-1},
  {t:"В компании я предпочитаю держать центр внимания, а не оставаться на периферии.",tr:"quiet",d:-1}
];
const PAIR_CHECKS = [[0,13],[4,56],[7,20],[11,24],[6,32],[8,21],[10,23],[5,18]];
const answers = new Array(QUESTIONS.length).fill(null);
let idx = 0;
const $ = id => document.getElementById(id);
function renderQuestion() {
  const q = QUESTIONS[idx];
  $("progressLabel").textContent = `Вопрос ${idx+1} из ${QUESTIONS.length}`;
  $("bar").style.width = `${(idx/QUESTIONS.length)*100}%`;
  $("qText").textContent = q.t;
  $("prevBtn").disabled = idx===0;
  $("nextBtn").textContent = idx===QUESTIONS.length-1 ? "Показать результат" : "Дальше";
  $("nextBtn").disabled = answers[idx]==null;
  const scale = $("scale"); scale.innerHTML = "";
  LABELS.forEach((lab,i)=>{
    const val=i+1, el=document.createElement("label");
    el.className="opt"+(answers[idx]===val?" selected":"");
    el.innerHTML=`<input type="radio" name="q" value="${val}"><div>${lab}</div>`;
    el.onclick=()=>{answers[idx]=val;renderQuestion();};
    scale.appendChild(el);
  });
}
function traitScores(){
  const acc={}; TRAITS.forEach(t=>acc[t]={sum:0,w:0});
  QUESTIONS.forEach((q,i)=>{
    if(q.tr==="sd"||answers[i]==null) return;
    acc[q.tr].sum += q.d===1?answers[i]:6-answers[i]; acc[q.tr].w+=5;
  });
  const out={}; TRAITS.forEach(t=>out[t]=acc[t].w?(acc[t].sum/acc[t].w)*100:50); return out;
}
function socialDesirability(){
  let s=0,n=0; QUESTIONS.forEach((q,i)=>{ if(q.tr!=="sd")return; s+=q.d===1?answers[i]:6-answers[i]; n+=5; });
  return n?(s/n)*100:50;
}
function consistency(){
  const diffs=PAIR_CHECKS.map(([a,b])=>{
    const sa=QUESTIONS[a].d===1?answers[a]:6-answers[a];
    const sb=QUESTIONS[b].d===1?answers[b]:6-answers[b];
    return Math.abs(sa-sb);
  });
  const avg=diffs.reduce((x,y)=>x+y,0)/diffs.length;
  return Math.max(0,Math.round(100-(avg/4)*100));
}
function similarity(user,m){ let d=0; TRAITS.forEach(t=>d+=Math.abs(user[t]-m.vec[t])); return Math.round((1-d/(100*TRAITS.length))*1000)/10; }
function traitName(t){ return {lead:"принятие ответственности за общее",nurture:"эмоциональная доступность и игровая близость",gentleman:"такт и сохранение лица другого",flow:"гибкость при смене условий",stage:"полная включённость при внешней оценке",quiet:"наблюдательность и потребность в паузе",craft:"автономия и порог качества",heart:"аффективная проницаемость",care:"практическая поддержка",philo:"рефлексия собственных рамок",verbal:"проговаривание как способ действовать",cool:"низкая эмоциональная заразительность",drive:"внутренняя планка независимо от статуса"}[t]; }
function topTraits(vec,n=4){ return Object.entries(vec).sort((a,b)=>b[1]-a[1]).slice(0,n); }
function explain(user,m){
  const shared=topTraits(user,5).map(x=>x[0]).filter(t=>topTraits(m.vec,5).map(x=>x[0]).includes(t));
  const gap=TRAITS.map(t=>({t,d:Math.abs(user[t]-m.vec[t])})).sort((a,b)=>b.d-a.d)[0];
  let text=m.whyLead+". ";
  if(shared.length) text+="Совпадают опорные оси: "+shared.map(traitName).join(", ")+". ";
  text+="Это сходство паттерна, не копия. ";
  if(gap&&gap.d>28) text+=`Самое заметное расхождение — «${traitName(gap.t)}».`;
  return text;
}
function renderResult(){
  const user=traitScores(), sd=socialDesirability(), cons=consistency();
  const ranked=MEMBERS.map(m=>({...m,score:similarity(user,m)})).sort((a,b)=>b.score-a.score);
  const [top,second,third]=ranked;
  const flags=[];
  if(sd>=78) flags.push("Шкала социальной желательности повышена: ответы чуть «слишком правильные».");
  if(cons<62) flags.push("Согласованность ниже обычной: на перефразах качества гуляют.");
  if(cons>=80&&sd<70) flags.push("Профиль внутренне ровный.");
  $("result").innerHTML=`
    <div class="card result-hero">
      <div class="match-card">
        <div class="kicker">ближайший портрет</div>
        <div style="font-size:14px;opacity:.8;margin-top:8px;">${top.emoji} ${top.kr} · ${top.mbti} · ${top.unit}</div>
        <h2 style="color:#fff;margin:8px 0 4px;">${top.name}</h2>
        <div class="pct">${top.score}%</div>
        <p style="opacity:.9;">${top.real}. Совпадение паттерна, не приговор.</p>
      </div>
      <div><h2>Почему именно ${top.name}</h2><div class="why">${explain(user,top)}</div><p>${top.portrait}</p></div>
    </div>
    <div class="card"><h2>Ещё два близких контура</h2>
      <p><strong>${second.name}</strong> (${second.score}%) — ${explain(user,second)}</p>
      <p style="margin-top:10px;"><strong>${third.name}</strong> (${third.score}%) — ${explain(user,third)}</p>
    </div>
    <div class="card"><h2>Полный рейтинг 13</h2>
      <div class="member-grid">${ranked.map(m=>`<div class="mchip"><div><strong>${m.name}</strong> · ${m.score}%</div><div class="barline"><div class="barfill" style="width:${m.score}%"></div></div></div>`).join("")}</div>
    </div>
    <div class="card"><h2>Ваш сырой профиль</h2>
      <div class="member-grid">${topTraits(user,13).map(([t,v])=>`<div class="mchip"><div>${traitName(t)}</div><div class="barline"><div class="barfill" style="width:${v}%"></div></div></div>`).join("")}</div>
    </div>
    <div class="card"><h2>Диагностические пометки</h2>
      <p>Согласованность: <strong>${cons}%</strong>. Желательность: <strong>${Math.round(sd)}%</strong>.</p>
      ${flags.map(f=>`<p class="why">${f}</p>`).join("")}
      <p class="disclaimer">Развлекательный портрет, не клиника.</p>
      <div class="row" style="margin-top:16px;"><button type="button" onclick="location.reload()">Пройти заново</button></div>
    </div>`;
}
$("startBtn").onclick=()=>{ $("intro").classList.add("hidden"); $("quiz").classList.remove("hidden"); renderQuestion(); window.scrollTo({top:0,behavior:"smooth"}); };
$("prevBtn").onclick=()=>{ if(idx>0){ idx--; renderQuestion(); window.scrollTo({top:0,behavior:"smooth"});} };
$("nextBtn").onclick=()=>{
  if(answers[idx]==null) return;
  if(idx<QUESTIONS.length-1){ idx++; renderQuestion(); window.scrollTo({top:0,behavior:"smooth"}); }
  else { $("quiz").classList.add("hidden"); $("result").classList.remove("hidden"); renderResult(); window.scrollTo({top:0,behavior:"smooth"}); }
};
</script>
