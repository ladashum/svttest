<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SVT</title>
<style>
:root{--bg:#111214;--card:#1b1c20;--line:#2c2e34;--text:#ece8e1;--mute:#9a958c;--accent:#c4a574}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif}
body{min-height:100dvh}
.wrap{max-width:430px;margin:0 auto;padding:16px 16px calc(24px + env(safe-area-inset-bottom))}
.progress{height:3px;background:var(--line);border-radius:3px;overflow:hidden;margin-bottom:16px}
.progress>span{display:block;height:100%;background:var(--accent);width:0;transition:width .2s ease}
h1{font-size:22px;font-weight:600;letter-spacing:-.02em;margin-bottom:8px}
p.lead{color:var(--mute);font-size:14px;line-height:1.5;margin-bottom:18px}
.meta{color:var(--mute);font-size:12px;margin-bottom:12px}
.q{font-size:18px;line-height:1.4;font-weight:500;margin-bottom:16px}
.scale{display:flex;flex-direction:column;gap:8px}
button.opt{appearance:none;border:1px solid var(--line);background:var(--card);color:var(--text);text-align:left;padding:12px 14px;border-radius:12px;font-size:15px;line-height:1.35}
button.opt.on{border-color:var(--accent);background:#2a241b}
.nav{display:flex;gap:8px;margin-top:18px}
.nav button,.start,.again{border:0;border-radius:12px;padding:13px 12px;font-size:15px;font-weight:600}
.nav button{flex:1}
.back{background:var(--card);color:var(--text);border:1px solid var(--line)!important}
.next,.start{background:var(--accent);color:#1a140c;width:100%}
.next:disabled{opacity:.4}
.kicker{font-size:13px;color:var(--mute);margin-bottom:4px}
.name{font-size:28px;font-weight:650;margin-bottom:6px}
.pct{color:var(--accent);font-size:15px;margin-bottom:14px}
.why{font-size:15px;line-height:1.55;margin-bottom:12px}
.why p+p{margin-top:10px}
.row{display:flex;justify-content:space-between;padding:8px 0;border-top:1px solid var(--line);font-size:14px}
.row span:last-child{color:var(--mute)}
.flag{color:var(--mute);font-size:13px;line-height:1.45;margin:12px 0 16px}
.again{width:100%;margin-top:18px;background:transparent;color:var(--text);border:1px solid var(--line)}
</style>
</head>
<body>
<div class="wrap" id="app"></div>

тобы другие не узнали, как плохо обстоят дела.", "Я могу быть лёгким и шутливым.", "Я заступаюсь, если с человеком обошлись несправедливо.", "Неопределённость меня напрягает, хочется скорее всё определить.", "Моё настроение обычно ровное и ясное.", "Я составляю план и стараюсь его держать.", "Я быстро увлекаюсь новым делом.", "Делаю вид, что ничего особенного не произошло.", "Уходя, я возвращаюсь проверить, всё ли закрыто и выключено.", "Решение я принимаю с оглядкой на то, как оно ударит по людям.", "Я живой и подвижный.", "Прокручиваю в уме, что сказать или сделать.", "К новой обстановке я привыкаю быстро.", "Ищу, чему эта ситуация меня научила.", "Грустный фильм может довести меня до слёз.", "Составляю план и иду по нему.", "Выступать перед большой аудиторией мне трудно.", "Если у меня нет настроения или я зол, я стараюсь не подходить к людям.", "Неровно висящая вещь меня раздражает, и я поправляю её.", "Держу чувства так, чтобы они меньше мешали другим делам.", "В работе мне важно быть среди первых.", "Ищу, с кем это обсудить.", "В разговоре я больше молчу, чем говорю.", "Я лучше замечаю факты и детали, чем общие идеи.", "Меня легко растрогать.", "Жёсткий распорядок меня напрягает сильнее, чем неопределённость.", "Если со мной поступают несправедливо, я отстаиваю своё.", "Многое я делаю в последний момент.", "Мне трудно долго сидеть на месте.", "Прошу прощения и пытаюсь загладить.", "После разочарования я могу упасть духом.", "Сначала я думаю, потом говорю.", "Ложусь в хорошем состоянии, а утром встаю в тяжёлом.", "Решение я принимаю по логике дела."];

const TYPES={
coups:{name:"S.Coups",src:"СМИЛ: тревожность и ответственность. Шмишек: педантичность и застревание. Лазарус: принятие ответственности и планирование.",why:["Вы берёте на себя общее дело, если видите, что за него никто не отвечает. Перед стартом долго прикидываете, сможете ли довести до конца.", "Если что-то ломается, сначала крутите на себе и работаете ещё. Вам важно не подвести тех, кто на вас рассчитывает.", "Слабое место: трудно отпустить контроль и просто побыть без роли старшего."]},
jeonghan:{name:"Jeonghan",src:"Шмишек: гипертимность и демонстративность в мягкой форме. MBTI: чувство и гибкость.",why:["Вы чувствуете, какое настроение в комнате, и чаще сглаживаете, чем идёте в лобовой спор. Шутка для вас способ не дать разговору стать слишком тяжёлым.", "К вам идут поговорить, потому что с вами спокойнее. Сами вы не всегда выдерживаете долгую напряжённую ответственность.", "Слабое место: свои границы иногда приходится угадывать другим, потому что прямо вы их обозначаете не сразу."]},
joshua:{name:"Joshua",src:"Шмишек: эмотивность и тревожность. MBTI: чувство. СМИЛ: эмоциональная лабильность в бытовом регистре.",why:["Вам важно, чтобы другому не было неловко. Сначала выравниваете обстановку, своё говорите потом.", "На вас можно положиться, но вы редко ставите себя в центр. Часто отодвигаете своё желание, лишь бы всем было спокойно.", "Слабое место: можно так привыкнуть быть удобным, что собственные слова теряются."]},
jun:{name:"Jun",src:"Шмишек: гипертимность без потребности опеки. MBTI: восприятие. СМИЛ: индивидуалистичность.",why:["Вы живёте в своём темпе и не любите, когда вас ведут и опекают. Объяснять, почему вам так удобнее, быстро надоедает.", "Чужой жёсткий распорядок утомляет сильнее, чем вечер наедине с собой. Обиды и сбои отпускаете быстрее многих.", "Слабое место: вас легко принять за холодного человека, хотя речь не о холоде, а о том, что свой ритм вы не отдаёте."]},
hoshi:{name:"Hoshi",src:"Шмишек: гипертимность, возбудимость, экзальтация. СМИЛ: оптимистичность.",why:["Когда дело на виду, вы почти не умеете работать вполсилы. Вам нужно включиться целиком.", "В работе собираетесь. Без задачи легко теряете рамку и действуете по импульсу. Отдохнуть через паузу вам труднее, чем через новое действие.", "Слабое место: если некуда деть энергию, становится неспокойно."]},

woozi:{name:"Woozi",src:"Шмишек: педантичность. MBTI: решение и сенсорика. Лазарус: самоконтроль и план.",why:["Вам спокойнее доводить дело одному и по своей мерке. Пока результат ниже вашей планки, радости почти нет.", "Когда в работу лезут на середине, это сбивает сильнее, чем усталость. Чувства часто уходят в само дело, а не в разговор.", "Слабое место: пока вещь не доведена, вас почти нет в обычной жизни рядом с людьми."]},
dk:{name:"DK",src:"Шмишек: эмотивность и циклотимность. СМИЛ: эмоциональная лабильность.",why:["Чужое настроение заходит к вам почти без фильтра. Вам важно, чтобы рядом было спокойно.", "Доброта настоящая, но тяжёлая: хочется быть удобным для всех. Свою трудность чаще оставляете при себе, чтобы не нагружать близких.", "Слабое место: день другого человека может стать вашим, если вовремя не сказать «хватит»."]},
mingyu:{name:"Mingyu",src:"Шмишек: гипертимность. MBTI: экстраверсия и чувство. Лазарус: поиск поддержки через действие.",why:["Связь вы держите делом: присутствием, помощью, бытом. Тишина рядом для вас не нейтральна, хочется чем-то её закрыть.", "Если помощь не берут, задевает не гордость, а ощущение, что вас некуда пристроить. Вам важнее быть нужным, чем быть на виду.", "Слабое место: трудно просто быть рядом, ничего не делая."]},

seungkwan:{name:"Seungkwan",src:"Шмишек: демонстративность и застревание на несправедливости. Лазарус: поиск поддержки и конфронтация речью.",why:["Переживание для вас закрывается, когда оно сказано вслух. Если другу тяжело, скорее дадите совет, чем просто помолчите.", "За своих вступаетесь сразу и сами замечаете, что тон бывает резким. Без разговора вам тесно.", "Слабое место: совет иногда подменяет простое «я рядом»."]},
vernon:{name:"Vernon",src:"СМИЛ: интроверсия. Шмишек: дистимичность без жалобы. MBTI: мышление и сенсорика. Лазарус: дистанцирование.",why:["Общий шум компании вас слабо качает. Смеётесь, когда смешно вам, а не когда принято. Паузу заполнять не считаете своей работой.", "Чувства есть, просто вы не выкладываете их как общее имущество. Вам ближе ровный темп и конкретные факты.", "Слабое место: близким бывает непонятно, тепло вам или нет, хотя вопрос стоит не так."]},
dino:{name:"Dino",src:"Шмишек: застревание и педантичность усилия. Лазарус: принятие ответственности и переоценка.",why:["Планку для себя вы почти не снижаете из-за места среди людей. Сравниваете себя скорее с собой вчерашним, чем с чужим успехом.", "Помеху и обиду помните как задачу, а не как повод уйти. Когда вас начинают вести и опекать, внутренне отодвигаетесь.", "Слабое место: трудно сказать себе «достаточно»."]}

function score(){
const raw={},max={};
ORDER.forEach(k=>{raw[k]=0;max[k]=0});

});
const list=ORDER.map(k=>({id:k,name:TYPES[k].name,pct:max[k]?Math.round((raw[k]/max[k])*100):0})).sort((a,b)=>b.pct-a.pct);
let unstable=0;
PAIRS_SAME.forEach(([i,j])=>{const x=state.a[i],y=state.a[j];if(typeof x==="number"&&typeof y==="number"&&Math.abs(x-y)>2)unstable++});
PAIRS_INV.forEach(([i,j])=>{const x=state.a[i],y=state.a[j];if(typeof x==="number"&&typeof y==="number"&&Math.abs(x-(6-y))>2)unstable++});
return{list,unstable};
}
function dimScore(prefix){
const raw={},max={};
for(let i=0;i<Q.length;i++){
const v=state.a[i]; if(typeof v!=="number") continue;
(TAGS[Q[i]]||[]).forEach(t=>{
if(!t.startsWith(prefix)) return;
raw[t]=(raw[t]||0)+v; max[t]=(max[t]||0)+5;
});
}
return Object.keys(raw).map(k=>({id:k.slice(prefix.length),pct:Math.round(raw[k]/max[k]*100)})).sort((a,b)=>b.pct-a.pct);
}
function mbtiPair(a,b){
const raw={}; const max={};
for(let i=0;i<Q.length;i++){
const v=state.a[i]; if(typeof v!=="number") continue;
(TAGS[Q[i]]||[]).forEach(t=>{
if(t==="mbti:"+a||t==="mbti:"+b){raw[t.slice(5)]=(raw[t.slice(5)]||0)+v;max[t.slice(5)]=(max[t.slice(5)]||0)+5}
});
}
const pa=max[a]?raw[a]/max[a]:0, pb=max[b]?raw[b]/max[b]:0;
return pa>=pb?a:b;
}
