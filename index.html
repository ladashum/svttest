<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SVT</title>
<style>
:root{--bg:#111214;--card:#1b1c20;--line:#2c2e34;--text:#ece8e1;--mute:#9a958c;--accent:#c4a574}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif}
body{min-height:100dvh}
.wrap{max-width:430px;margin:0 auto;padding:16px 16px calc(24px + env(safe-area-inset-bottom))}
.progress{height:3px;background:var(--line);border-radius:3px;overflow:hidden;margin-bottom:16px}
.progress>span{display:block;height:100%;background:var(--accent);width:0;transition:width .2s ease}
h1{font-size:22px;font-weight:600;letter-spacing:-.02em;margin-bottom:8px}
p.lead{color:var(--mute);font-size:14px;line-height:1.5;margin-bottom:18px}
.meta{color:var(--mute);font-size:12px;margin-bottom:12px}
.q{font-size:18px;line-height:1.4;font-weight:500;margin-bottom:16px}
.scale{display:flex;flex-direction:column;gap:8px}
button.opt{appearance:none;border:1px solid var(--line);background:var(--card);color:var(--text);text-align:left;padding:12px 14px;border-radius:12px;font-size:15px;line-height:1.35}
button.opt.on{border-color:var(--accent);background:#2a241b}
.nav{display:flex;gap:8px;margin-top:18px}
.nav button,.start,.again{border:0;border-radius:12px;padding:13px 12px;font-size:15px;font-weight:600}
.nav button{flex:1}
.back{background:var(--card);color:var(--text);border:1px solid var(--line)!important}
.next,.start{background:var(--accent);color:#1a140c;width:100%}
.next:disabled{opacity:.4}
.kicker{font-size:13px;color:var(--mute);margin-bottom:4px}
.name{font-size:28px;font-weight:650;margin-bottom:6px}
.pct{color:var(--accent);font-size:15px;margin-bottom:14px}
.why{font-size:15px;line-height:1.55;margin-bottom:12px}
.why p+p{margin-top:10px}
.row{display:flex;justify-content:space-between;padding:8px 0;border-top:1px solid var(--line);font-size:14px}
.row span:last-child{color:var(--mute)}
.flag{color:var(--mute);font-size:13px;line-height:1.45;margin:12px 0 16px}
.again{width:100%;margin-top:18px;background:transparent;color:var(--text);border:1px solid var(--line)}
</style>
</head>
<body>
<div class="wrap" id="app"></div>

const SCALE=["Не про меня","Скорее нет","Бывает по-разному","Скорее да","Про меня"];
const Q=["Бывают минуты, когда меня переполняет радость.", "Сначала говорю, потом думаю.", "Обиды я отпускаю быстро.", "Жизнь часто кажется мне тяжёлой.", "Мне спокойнее работать одному.", "Я часто смеюсь.", "Закончив работу, я сомневаюсь и перепроверяю её.", "Незаконченное дело не даёт мне покоя.", "У меня бывают резкие переходы от подъёма к упадку.", "Мне близка роль того, кто собирает людей и ведёт дело.", "После людей мне обычно легче.", "Бывают дни, когда лучше меня не трогать.", "Мне ближе долгая точная работа, чем быстрая и черновая.", "Говорю кому-то, что я чувствую.", "Мысли о вчерашнем или о завтрашнем мешают уснуть.", "Несправедливость меня задевает надолго.", "Мне трудно говорить человеку неприятное в лицо.", "Я люблю веселье.", "Настроение у меня чаще пониженное, чем приподнятое.", "План я легко бросаю, если ситуация изменилась.", "Я легко плачу.", "В веселой компании я часто оказываюсь в центре.", "После людей мне нужно побыть одному.", "Если кого-то задел, я первым иду мириться.", "При неудаче у меня сохраняется чувство юмора.", "Стараюсь не показывать, что чувствую.", "Я скорее осторожен с людьми, чем доверчив.", "Я скорее серьёзный человек, чем беспечный.", "Я лучше вижу общий смысл, чем отдельные факты.", "Настроение зависит от погоды.", "Настроение портится и без ясной причины.", "Даю себе слово, что в следующий раз сделаю иначе.", "Если на пути помеха, я всё равно иду к цели.", "Я долго помню обиду.", "Рядом с людьми на работе мне спокойнее, чем в одиночестве.", "Я вспыхиваю быстро.", "Мне важно, чтобы каждая вещь стояла на своём месте.", "Удваиваю усилия, чтобы всё поправить.", "Меня беспокоит, как бы с близкими чего не случилось.", "Будущее я вижу скорее тревожно, чем спокойно.", "Смотрю, какой следующий шаг, и делаю его.", "Мне спокойнее, когда за дело отвечаю только я.", "Я легко схожусь с людьми.", "Корю себя.", "В обществе весёлых людей я сам становлюсь веселее.", "Моё настроение сильно зависит от того, что происходит вокруг.", "Стараюсь, чтобы другие не узнали, как плохо обстоят дела.", "Я могу быть лёгким и шутливым.", "Я заступаюсь, если с человеком обошлись несправедливо.", "Неопределённость меня напрягает, хочется скорее всё определить.", "Моё настроение обычно ровное и ясное.", "Я составляю план и стараюсь его держать.", "Я быстро увлекаюсь новым делом.", "Делаю вид, что ничего особенного не произошло.", "Уходя, я возвращаюсь проверить, всё ли закрыто и выключено.", "Решение я принимаю с оглядкой на то, как оно ударит по людям.", "Я живой и подвижный.", "Прокручиваю в уме, что сказать или сделать.", "К новой обстановке я привыкаю быстро.", "Ищу, чему эта ситуация меня научила.", "Грустный фильм может довести меня до слёз.", "Составляю план и иду по нему.", "Выступать перед большой аудиторией мне трудно.", "Если у меня нет настроения или я зол, я стараюсь не подходить к людям.", "Неровно висящая вещь меня раздражает, и я поправляю её.", "Держу чувства так, чтобы они меньше мешали другим делам.", "В работе мне важно быть среди первых.", "Ищу, с кем это обсудить.", "В разговоре я больше молчу, чем говорю.", "Я лучше замечаю факты и детали, чем общие идеи.", "Меня легко растрогать.", "Жёсткий распорядок меня напрягает сильнее, чем неопределённость.", "Если со мной поступают несправедливо, я отстаиваю своё.", "Многое я делаю в последний момент.", "Мне трудно долго сидеть на месте.", "Прошу прощения и пытаюсь загладить.", "После разочарования я могу упасть духом.", "Сначала я думаю, потом говорю.", "Ложусь в хорошем состоянии, а утром встаю в тяжёлом.", "Решение я принимаю по логике дела."];
const ORDER=["coups","jeonghan","joshua","jun","hoshi","wonwoo","woozi","dk","mingyu","the8","seungkwan","vernon","dino"];

const TYPES={
coups:{name:"S.Coups",src:"СМИЛ: тревожность и ответственность. Шмишек: педантичность и застревание. Лазарус: принятие ответственности и планирование.",why:["Человек этого типа берёт на себя целое, если у дела нет хозяина. Тревога направлена на сохранность общего больше, чем на собственное удобство. Начать трудно, пока нет уверенности, что работу можно довести до конца.","Самоуважение связано с тем, не подвёл ли он тех, кто на него опирается. В сбое он ищет свою долю вины и удваивает усилие.","Устойчивость держится невозможностью оставить поле без присмотра."]},
jeonghan:{name:"Jeonghan",src:"Шмишек: гипертимность и демонстративность в мягкой форме. MBTI: чувство и гибкость.",why:["Человек этого типа принимает чужое состояние и одновременно не даёт обстановке стать слишком тяжёлой. Забота идёт вместе с шуткой и обходом прямого столкновения.","К нему идут с жалобой, потому что он умеет удержать и слегка направить. Настойчивость в долгом напряжении ниже, чем кажется по роли того, к кому приходят.","Отношение спасается не прямотой, а точным чтением того, какой тон сейчас возможен."]},
joshua:{name:"Joshua",src:"Шмишек: эмотивность и тревожность. MBTI: чувство. СМИЛ: эмоциональная лабильность в бытовом регистре.",why:["Человек этого типа следит, чтобы обращение не ставило другого в неловкое положение. Он выравнивает атмосферу раньше, чем заявляет своё.","Надёжность здесь без острого самоутверждения. Риск состоит в том, что собственная мысль откладывается ради спокойствия поля.","Сила в такте. Цена в растворении."]},
jun:{name:"Jun",src:"Шмишек: гипертимность без потребности опеки. MBTI: восприятие. СМИЛ: индивидуалистичность.",why:["Человек этого типа сохраняет свой ритм и неохотно объясняет, почему действует иначе. Трудное стряхивается быстрее, чем у большинства.","Жёсткий чужой распорядок утомляет сильнее, чем вечер наедине с собой. Отделённость здесь не холод, а отказ отдавать автономию.","Его нельзя сломать требованием быть понятным для всех. Его можно потерять, если заставить жить в чужом темпе."]},
hoshi:{name:"Hoshi",src:"Шмишек: гипертимность, возбудимость, экзальтация. СМИЛ: оптимистичность.",why:["Человек этого типа почти не допускает работы вполсилы, когда результат будут видеть. Представление о себе связано с полнотой усилия и живым включением.","В деле он собирается. Вне дела легко теряет структуру и действует импульсом. Напряжение снимается деятельностью, а не паузой.","Сила во включённости. Цена в том, что без усилия собственное «я» становится неясным."]},
wonwoo:{name:"Wonwoo",src:"СМИЛ: интроверсия. Шмишек: дистимичность. Лазарус: самоконтроль и дистанция. MBTI: интроверсия.",why:["Человек этого типа наблюдает чаще, чем заполняет воздух. Пауза его не пугает. Привязанность есть и редко переводится в постоянную речь, поэтому дистанцию принимают за холод.","В трудной ситуации он скорее удержит реакцию при себе и отойдёт от людей, чем вынесет переживание в комнату.","Он не отсутствует. Он экономит контакт. Ему нужны люди, которые не требуют непрерывной демонстрации тепла."]},
woozi:{name:"Woozi",src:"Шмишек: педантичность. MBTI: решение и сенсорика. Лазарус: самоконтроль и план.",why:["Человек этого типа завершает дело в уединении и держит внутренний порог выше внешней удобности. Пока вещь ниже его меры, радости почти нет.","Вмешательство в процесс сбивает сильнее, чем отсутствие компании. Аффект уходит в работу. Строгость относится к качеству, не к унижению человека.","Устойчивость держится мастерством. Сила в критерии. Цена в исчезновении из бытового поля, пока вещь не доведена."]},
dk:{name:"DK",src:"Шмишек: эмотивность и циклотимность. СМИЛ: эмоциональная лабильность.",why:["Человек этого типа пропускает чужое состояние почти без фильтра. Ему важно, чтобы окружающим было спокойно. Оценка и чужая усталость заходят далеко.","Доброта естественна и тяжела: образ всегда удобного человека давит. Свою трудность он скорее удержит при себе, чем потревожит близких.","Комната согревается ценой собственной проницаемости. Нужна граница, иначе настроение другого становится телом."]},
mingyu:{name:"Mingyu",src:"Шмишек: гипертимность. MBTI: экстраверсия и чувство. Лазарус: поиск поддержки через действие.",why:["Человек этого типа держит связь делом: едой, бытом, присутствием, чтобы другому не было пусто. Тишина рядом для него не нейтральна.","Если помощь отклоняют, возникает обида не от тщеславия, а от потери понятной функции. Заметность вторична относительно нужности.","Он существует, когда может закрыть чужую нужду. Ему нужно учиться быть, не только делать."]},
the8:{name:"The8",src:"MBTI: интуиция. СМИЛ: индивидуалистичность. Лазарус: положительная переоценка.",why:["Человек этого типа долго сверялся с тем, как его видят, и затем вынес меру внутрь. Он осторожен с людьми и лучше держит общий смысл, чем россыпь фактов.","Много сил уходит на вопрос, кто он без внешней оценки. Разбор себя иногда подменяет простое действие. В сбое он ищет, чему ситуация его научила.","Рост идёт через пересмотр рамки. Сила в сознательности. Цена в бесконечной сборке себя вместо жизни."]},
seungkwan:{name:"Seungkwan",src:"Шмишек: демонстративность и застревание на несправедливости. Лазарус: поиск поддержки и конфронтация речью.",why:["Человек этого типа завершает переживание речью. Невысказанное остаётся незакрытым. В чужой трудности он скорее предложит ход, чем выдержит молчание.","За своих он вступается вслух и сам замечает резкость тона. Без разговора ему тесно.","Связь защищается голосом. Сила в явности. Цена в том, что совет подменяет присутствие."]},
vernon:{name:"Vernon",src:"СМИЛ: интроверсия. Шмишек: дистимичность без жалобы. MBTI: мышление и сенсорика. Лазарус: дистанцирование.",why:["Человек этого типа слабо заражается общим пульсом. Смех и реакция не обязаны совпадать с комнатой. Паузу он не считает долгом заполнить.","Чувство не отсутствует; оно не выставляется как общее имущество. Устойчивое устройство ближе к ровному темпу и оценке факта.","Его нельзя читать по шкале «тёплый или холодный». Сила в устойчивости. Цена в том, что близость не всегда находит, куда приземлиться."]},
dino:{name:"Dino",src:"Шмишек: застревание и педантичность усилия. Лазарус: принятие ответственности и переоценка.",why:["Человек этого типа не снижает требование к себе из-за статуса или места среди людей. Ориентир составляет сравнение с собственной недавней работой.","Обиду и помеху он помнит как задачу, а не как повод уйти. Когда его начинают опекать и вести, он внутренне отстраняется.","Он строится трудом. Сила в приросте. Цена в отсутствии права сказать «достаточно»."]}

function score(){
const raw={},max={};
ORDER.forEach(k=>{raw[k]=0;max[k]=0});
ORDER.forEach(k=>{

REVERSE[k].forEach(idx=>{max[k]+=5;const v=state.a[idx];if(typeof v==="number")raw[k]+=(6-v)});
});
const list=ORDER.map(k=>({id:k,name:TYPES[k].name,pct:max[k]?Math.round((raw[k]/max[k])*100):0})).sort((a,b)=>b.pct-a.pct);
let unstable=0;
PAIRS_SAME.forEach(([i,j])=>{const x=state.a[i],y=state.a[j];if(typeof x==="number"&&typeof y==="number"&&Math.abs(x-y)>2)unstable++});
PAIRS_INV.forEach(([i,j])=>{const x=state.a[i],y=state.a[j];if(typeof x==="number"&&typeof y==="number"&&Math.abs(x-(6-y))>2)unstable++});
return{list,unstable};
}
function dimScore(prefix){
const raw={},max={};
for(let i=0;i<Q.length;i++){
const v=state.a[i]; if(typeof v!=="number") continue;
(TAGS[Q[i]]||[]).forEach(t=>{
if(!t.startsWith(prefix)) return;
raw[t]=(raw[t]||0)+v; max[t]=(max[t]||0)+5;
});
}
return Object.keys(raw).map(k=>({id:k.slice(prefix.length),pct:Math.round(raw[k]/max[k]*100)})).sort((a,b)=>b.pct-a.pct);
}
function mbtiPair(a,b){
const raw={}; const max={};
for(let i=0;i<Q.length;i++){
const v=state.a[i]; if(typeof v!=="number") continue;
(TAGS[Q[i]]||[]).forEach(t=>{
if(t==="mbti:"+a||t==="mbti:"+b){raw[t.slice(5)]=(raw[t.slice(5)]||0)+v;max[t.slice(5)]=(max[t.slice(5)]||0)+5}
});
}
const pa=max[a]?raw[a]/max[a]:0, pb=max[b]?raw[b]/max[b]:0;
return pa>=pb?a:b;
}

const note='<p class="flag">Пункты взяты из рабочих шкал СМИЛ, опросника Леонгарда–Шмишека, копинг-теста Лазаруса и юнговских пар MBTI. Каждый блок представлен частично, поэтому тест не даёт полной диагностики по этим методикам и не утверждает стопроцентный результат. Он подходит только для того, чтобы узнать близкий тип личности из группы Seventeen, и не даёт объективной оценки личностной характеристики в целом.</p>';
